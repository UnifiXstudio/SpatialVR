name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios-client
          xcodegen generate

      - name: Build SpatialVR App
        run: |
          cd ios-client
          xcodebuild build \
            -project SpatialVR.xcodeproj \
            -scheme SpatialVR \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package to IPA
        run: |
          mkdir -p Payload
          cp -r ios-client/build/Build/Products/Release-iphoneos/SpatialVR.app Payload/
          zip -r -y SpatialVR.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpatialVR-iOS-App
          path: SpatialVR.ipa
