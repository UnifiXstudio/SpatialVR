name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build SpatialVR App
        run: |
          cd ios-client
          xcodebuild -project SpatialVR.xcodeproj \
            -scheme SpatialVR \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package to IPA
        run: |
          mkdir -p Payload
          cp -r ios-client/build/Build/Products/Release-iphoneos/SpatialVR.app Payload/
          zip -r SpatialVR.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpatialVR-iOS-App
          path: SpatialVR.ipa
