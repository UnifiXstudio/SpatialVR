name: SpatialVR
options:
  bundleIdPrefix: com.spatialvr
  deploymentTarget:
    iOS: "15.0"
targets:
  SpatialVR:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: SpatialVR
        excludes:
          - "Info.plist"
    info:
      path: SpatialVR/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spatialvr.desktop
        TARGETED_DEVICE_FAMILY: 1,2
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        AD_HOC_CODE_SIGNING_ALLOWED: YES
